<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de torque</title>
    <!-- CSS do site + CSS exclusivo desta tela -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="calculadora.css" />
  </head>
  <body class="calc-body">
    <div id="navbar-container"></div>

    <main class="calc-page">
      <div class="calc-card">
        <h1>Calculadora de torque</h1>

        <div class="calc-grid">
          <!-- ESQUERDA: formulário -->
          <form class="calc-form" id="form">
            <div class="calc-bloco">
              <label for="op1">1 - Selecione o material 1:</label>
              <select id="op1">
                <option value="aco">Aço</option>
                <option value="aluminio">Alumínio</option>
                <option value="metal">Metal</option>
                <option value="psai">PSAI</option>
                <option value="plastico">Plástico</option>
              </select>
              <div class="calc-espessura">
                <label for="esp1">Insira a espessura</label>
                <input
                  type="text"
                  id="esp1"
                  inputmode="decimal"
                  placeholder="mm"
                />
              </div>
            </div>

            <div class="calc-bloco">
              <label for="op2">2 - Selecione o material 2:</label>
              <select id="op2">
                <option value="aco">Aço</option>
                <option value="aluminio">Alumínio</option>
                <option value="metal">Metal</option>
                <option value="psai">PSAI</option>
                <option value="plastico">Plástico</option>
              </select>
              <div class="calc-espessura">
                <label for="esp2">Insira a espessura</label>
                <input
                  type="text"
                  id="esp2"
                  inputmode="decimal"
                  placeholder="mm"
                />
              </div>
            </div>

            <div class="calc-bloco">
              <label class="calc-check">
                <input type="checkbox" id="usarParafuso" /> Usar parafuso
              </label>
              <label for="op3">3 - Selecione o tamanho do parafuso:</label>
              <select id="op3" disabled>
                <option value="4.0">4,0 mm</option>
                <option value="4.2">4,2 mm</option>
                <option value="4.5">4,5 mm</option>
                <option value="4.8">4,8 mm (3/16″)</option>
                <option value="5.0">5,0 mm (M5)</option>
                <option value="6.0">6,0 mm (M6)</option>
                <option value="8.0">8,0 mm (M8)</option>
                <option value="10.0">10,0 mm (M10)</option>
              </select>
            </div>

            <button type="submit" class="bt">CALCULAR TORQUE</button>
          </form>

          <!-- DIREITA: resultado -->
          <aside class="calc-resultado" aria-live="polite">
            <p>Você precisa de</p>
            <p class="calc-valor">
              <span id="valor">--</span><small>N.M</small>
            </p>
            <p>
              de força para fixar o <span id="m1">[material1]</span> no
              <span id="m2">[material2]</span> com
              <span id="parafuso">[parafuso]</span>. Ajuste sua parafusadeira
              para
            </p>

            <div class="calc-faixa">
              <div class="calc-caixa calc-minimo">
                <span class="calc-rotulo">MÍNIMO</span>
                <span class="calc-numero" id="min">--</span>
              </div>
              <div class="calc-caixa calc-maximo">
                <span class="calc-rotulo">MÁXIMO</span>
                <span class="calc-numero" id="max">--</span>
              </div>
            </div>

            <p>
              Um torque intermediário entre o mínimo e máximo pode ser
              utilizado.
              <strong
                >NÃO UTILIZAR O TORQUE MÁXIMO PARA NENHUMA OPERAÇÃO.</strong
              >
            </p>
            <p class="calc-nota" id="nota"></p>
          </aside>
        </div>
      </div>
    </main>

    <!-- Footer do site: mantenha o mesmo mecanismo das outras páginas -->
    <div id="footer-container"></div>

    <script src="calculadora.js"></script>
  </body>
</html>
